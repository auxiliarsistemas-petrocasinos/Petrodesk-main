name: P0 security

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: petrodesk_test_user
          POSTGRES_PASSWORD: petrodesk_test_password
          POSTGRES_DB: petrodesk_test_ci
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U petrodesk_test_user -d petrodesk_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      PETRODESK_TEST_PG_HOST: 127.0.0.1
      PETRODESK_TEST_PG_PORT: 55432
      PETRODESK_TEST_PG_DATABASE: petrodesk_test_ci
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install backend
        working-directory: server
        run: npm ci
      - name: Prepare isolated database
        working-directory: server
        run: npm run test:db:prepare
      - name: Backend checks
        working-directory: server
        run: |
          npm run lint:check
          npm run typecheck
          npm run test:unit
          npm run test:integration
          npm run test:e2e
          npm run test:coverage
          npm run build
      - name: Backend dependency audit
        working-directory: server
        run: npm audit --audit-level=high
      - name: Install and verify frontend
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
